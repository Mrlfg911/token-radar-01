<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Token Radar — pre-token protocols ranked by implied launch value</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="brand">
      <span class="mark">◉</span>
      <div>
        <h1>Token Radar</h1>
        <p class="dek">Pre-token protocols ranked by implied launch value — fitted from the snapshot's own live tokens, not assumed.</p>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
</header>

<nav class="tabs wrap" id="tabs">
  <button class="tab is-active" data-view="board">Board</button>
  <button class="tab" data-view="model">Model</button>
  <button class="tab" data-view="detail">Detail</button>
  <span class="spacer"></span>
  <span class="meta" id="asof"></span>
</nav>

<main class="wrap">
  <!-- ================= BOARD ================= -->
  <section id="view-board" class="view is-active">
    <div class="filters" id="filters">
      <input id="q" type="search" placeholder="Search name, slug, category…" />
      <select id="cat"><option value="">All categories</option></select>
      <select id="chain"><option value="">All chains</option></select>
      <select id="set">
        <option value="">All rows</option>
        <option value="watch">Watchlist only</option>
        <option value="early">Pre-token outside watchlist</option>
        <option value="live">Live tokens</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div class="tablebox">
      <table id="board">
        <thead>
          <tr>
            <th data-sort="rank">#</th>
            <th data-sort="name">Protocol</th>
            <th data-sort="category">Category</th>
            <th data-sort="tvl_usd" class="num">TVL</th>
            <th data-sort="change_7d" class="num">7d</th>
            <th data-sort="age_days" class="num">Age</th>
            <th data-sort="launch_odds" class="num">P(launch)</th>
            <th data-sort="implied_value_usd" class="num">Implied value</th>
            <th data-sort="expected_value_usd" class="num">EV</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="note" id="boardnote"></p>
  </section>

  <!-- ================= MODEL ================= -->
  <section id="view-model" class="view">
    <div id="modelpanel"></div>
  </section>

  <!-- ================= DETAIL ================= -->
  <section id="view-detail" class="view">
    <div class="detailhead">
      <select id="dselect"></select>
      <span class="meta" id="dsub"></span>
    </div>
    <div id="detail"></div>
  </section>
</main>

<footer class="foot wrap">
  <span id="footmeta"></span>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
